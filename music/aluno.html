<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha aula · AAS Music</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2a2118;--soft:#5c5046;--line:#e6dccd;--gold:#a8742c;--gold-l:#f3e6cf;--play:#2e7d4f;--stop:#b23a2e;--serif:'Lora',Georgia,serif;--sans:'Atkinson Hyperlegible',Verdana,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:21px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{width:min(760px,92%);margin:auto}
header{padding:40px 0 14px;text-align:center}
.brand{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:var(--serif);font-size:clamp(2rem,7vw,2.8rem);line-height:1.15;margin-top:6px}
h1 em{color:var(--gold)}
header p{color:var(--soft);margin-top:8px}
.step{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:28px 24px;margin:24px 0;box-shadow:0 10px 30px #6b4a1a12}
.tag{display:inline-block;background:var(--gold-l);color:#7a521c;font-weight:700;font-size:17px;padding:6px 16px;border-radius:999px;margin-bottom:12px}
h2{font-family:var(--serif);font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.2;margin-bottom:10px}
.step>p{color:var(--soft);margin-bottom:18px}
.note{background:#fff6e4;border-left:6px solid var(--gold);border-radius:0 16px 16px 0;padding:16px 18px;font-size:20px;white-space:pre-line}
.note b{display:block;font-size:16px;color:#7a521c;margin-bottom:4px}
.chords{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chord{min-width:0;border:2px solid var(--line);border-radius:20px;padding:14px 10px 16px;text-align:center}
.chord h3{font-family:var(--serif);font-size:2.3rem;line-height:1}
.chord h3 small{display:block;font-family:var(--sans);font-size:16px;color:var(--soft);font-weight:400;margin-top:4px}
.chord svg{width:100%;max-width:180px;height:auto;margin:8px auto 10px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;padding:12px 18px;border-radius:18px;border:0;font-family:var(--sans);font-size:21px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn svg{width:26px;height:26px;flex:none}
.btn:focus-visible,.speed button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn-hear{background:var(--gold);color:#fff}
.btn-play{background:var(--play);color:#fff;min-height:80px;font-size:25px}
.btn-play.on{background:var(--stop)}
.btn:active{transform:scale(.98)}
.speed{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.speed button{min-height:58px;border-radius:16px;border:2px solid var(--line);background:#fff;font-family:var(--sans);font-size:20px;font-weight:700;color:var(--soft);cursor:pointer}
.speed button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-l);color:#6a4614}
.screen{margin:18px 0;border-radius:22px;background:#2a2118;color:#fff;text-align:center;padding:20px 14px 24px}
.screen .label{font-size:18px;color:#d8c9b2}
.screen .now{font-family:var(--serif);font-size:clamp(5rem,26vw,8rem);line-height:1.05;color:#f6dfb5}
.screen .next{font-size:19px;color:#d8c9b2}
.screen .next b{color:#fff;font-size:24px}
.screen .part{display:inline-block;margin-top:8px;font-size:18px;color:#2a2118;background:#f6dfb5;border-radius:999px;padding:4px 16px;font-weight:700}
.screen .part:empty{display:none}
.bar{height:10px;background:#ffffff22;border-radius:10px;margin:16px 10px 0;overflow:hidden}
.bar div{height:100%;width:0;background:#f6dfb5}
.ptitle{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:16px 0 4px}
.line{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;margin:4px 0;border:2px solid transparent}
.chips{display:flex;gap:6px;flex:none}
.chips i{font-style:normal;min-width:50px;height:50px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font-family:var(--serif);font-size:1.4rem;font-weight:600;background:var(--gold-l);color:#6a4614}
.chips i.cur{background:var(--gold);color:#fff}
.line .tx{font-size:21px;min-width:0}
.line.on{background:#fff6e4;border-color:var(--gold)}
.tip{background:#fff6e4;border-left:6px solid var(--gold);border-radius:0 16px 16px 0;padding:16px 18px;margin-top:6px;font-size:20px}
.empty{text-align:center;padding:80px 0}
footer{text-align:center;color:var(--soft);font-size:16px;padding:18px 0 50px}
footer a{color:var(--gold)}
@media(max-width:480px){body{font-size:20px}.step{padding:22px 16px;border-radius:22px}.chords{gap:10px}.line{padding:10px;flex-wrap:wrap}.line .tx{font-size:20px;flex-basis:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-ear" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
</svg>
<div id="app"></div>
<footer>Feito com <a href="./">AAS Music</a> · AAS Tecnologia Editorial</footer>

<script src="engine.js"></script>
<script>
(function(){
"use strict";
var A=window.AASM, esc=A.esc, app=document.getElementById('app');
var L=A.decode(location.hash);
if(!L||!L.m){
  app.innerHTML='<div class="wrap empty"><div class="brand">AAS Music</div><h1>Aula <em>não encontrada</em></h1><p style="color:#5c5046;margin-top:14px">Peça ao seu professor para enviar o link de novo, completo.</p></div>';
  return;
}
document.title=(L.a?'Aulas de '+L.a:'Minha aula')+' · AAS Music';

var songs=L.m.map(function(m){var p=A.parse(m.x,m.b);return {n:m.n,style:m.y,slow:m.s||70,normal:m.f||90,lines:p.lines,segs:p.segs};}).filter(function(s){return s.segs.length;});
var all=[];songs.forEach(function(s){A.uniqueChords(s.segs).forEach(function(c){if(all.indexOf(c)<0)all.push(c);});});

var h='<header class="wrap"><div class="brand">AAS Music</div><h1>Aulas <em>'+esc(L.a||'de violão')+'</em></h1><p>'+esc([L.p?(/^prof/i.test(L.p)?L.p:'Prof. '+L.p):'',L.t].filter(Boolean).join(' · '))+'</p></header><main class="wrap">';
if(L.r) h+='<div class="note"><b>Recado do professor</b>'+esc(L.r)+'</div>';
var n=1;
h+='<section class="step"><span class="tag">Passo '+(n++)+'</span><h2>Os acordes</h2><p>Monte o acorde no violão e toque. Depois aperte <b>Ouvir</b> e compare.</p><div class="chords">';
all.forEach(function(c){h+='<div class="chord"><h3>'+c+' <small>'+esc(A.CH[c].n)+'</small></h3>'+A.diagram(c,'light')+'<button class="btn btn-hear" data-hear="'+c+'"><svg><use href="#i-ear"/></svg>Ouvir</button></div>';});
h+='</div><div class="tip">Números nas bolinhas = <b>dedos</b>: 1 indicador, 2 médio, 3 anelar, 4 mindinho. <b>×</b> = não tocar essa corda.</div></section>';
if(all.length>1){
  h+='<section class="step"><span class="tag">Passo '+(n++)+'</span><h2>Treinar a troca</h2><p>O som toca '+all.join(', ')+' e repete. Troque quando a tela mudar.</p><div data-player="treino"></div></section>';
}
songs.forEach(function(s,i){
  h+='<section class="step"><span class="tag">Passo '+(n++)+'</span><h2>'+esc(s.n||'Música '+(i+1))+'</h2><p>Aperte <b>Tocar</b>. A tela conta 4, 3, 2, 1 e a música começa.</p><div data-player="'+i+'"></div></section>';
});
h+='<div class="tip" style="margin-bottom:10px">Sem som? Tire o celular do <b>silencioso</b> e aumente o volume.</div></main>';
app.innerHTML=h;

document.querySelectorAll('[data-hear]').forEach(function(b){b.addEventListener('click',function(){A.hear(b.dataset.hear);});});

function build(el,song,isTrain){
  var x='<button class="btn btn-play" data-play><svg><use href="#i-play"/></svg><span>Tocar</span></button>';
  x+='<div class="speed"><button data-sp="slow" aria-pressed="true">Devagar</button><button data-sp="normal" aria-pressed="false">Normal</button></div>';
  x+='<div class="screen"><div class="label" data-lab>Toque agora:</div><div class="now" data-now></div><div class="next" data-next></div><div class="part" data-part></div><div class="bar"><div data-bar></div></div></div>';
  if(!isTrain){
    var lp=null;
    song.lines.forEach(function(l,li){
      if(l.part&&l.part!==lp){x+='<div class="ptitle">'+esc(l.part)+'</div>';lp=l.part;}
      x+='<div class="line" data-l="'+li+'"><span class="chips">'+l.chords.map(function(c){return '<i>'+c.c+'</i>';}).join('')+'</span><span class="tx">'+esc(l.tx)+'</span></div>';
    });
  }
  el.innerHTML=x;
  var q=function(s){return el.querySelector(s);},btn=q('[data-play]'),nowE=q('[data-now]'),nxE=q('[data-next]'),labE=q('[data-lab]'),partE=q('[data-part]'),barE=q('[data-bar]'),lines=el.querySelectorAll('[data-l]');
  var speed='slow',stopFn=null;
  function idle(){
    var s=song.segs;labE.textContent='Toque agora:';nowE.textContent=s[0].c;nxE.innerHTML=s[1]?'Depois: <b>'+s[1].c+'</b>':'';partE.textContent=s[0].part||'';barE.style.width='0';
    lines.forEach(function(l){l.classList.remove('on');l.querySelectorAll('i').forEach(function(i){i.classList.remove('cur');});});
    btn.classList.remove('on');btn.innerHTML='<svg><use href="#i-play"/></svg><span>Tocar</span>';
  }
  idle();
  function start(again){
    stopFn=A.play(song.segs,{style:song.style,bpm:song[speed],loop:isTrain,count:!again,
      onUpdate:function(u){
        if(u.phase==='count'){labE.textContent='Prepare-se…';nowE.textContent=u.count;nxE.innerHTML='Começa com: <b>'+song.segs[0].c+'</b>';return;}
        barE.style.width=(u.progress*100)+'%';
        if(!u.changed||u.seg<0) return;
        var s=song.segs[u.seg],nx=song.segs[u.seg+1];
        labE.textContent='Toque agora:';nowE.textContent=s.c;
        nxE.innerHTML=nx?'Depois: <b>'+nx.c+'</b>':(isTrain?'Depois: <b>'+song.segs[0].c+'</b>':'<b>Último!</b>');
        partE.textContent=s.part||'';
        if(lines.length){
          var idx=0;for(var k=0;k<u.seg;k++) if(song.segs[k].line===s.line) idx++;
          lines.forEach(function(l,li){var on=li===s.line;l.classList.toggle('on',on);l.querySelectorAll('i').forEach(function(i,ii){i.classList.toggle('cur',on&&ii===idx);});});
          var le=lines[s.line],r=le.getBoundingClientRect();
          if(r.top<20||r.bottom>innerHeight-20) le.scrollIntoView({block:'center',behavior:'smooth'});
        }
      },
      onEnd:function(natural){stopFn=null;if(natural&&isTrain){start(true);}else idle();}
    });
    if(stopFn){btn.classList.add('on');btn.innerHTML='<svg><use href="#i-stop"/></svg><span>Parar</span>';}
  }
  btn.addEventListener('click',function(){if(stopFn){var f=stopFn;stopFn=null;f();}else start();});
  el.querySelectorAll('[data-sp]').forEach(function(b){b.addEventListener('click',function(){
    speed=b.dataset.sp;el.querySelectorAll('[data-sp]').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
    if(stopFn){var f=stopFn;stopFn=null;f();start();}
  });});
}
if(all.length>1){
  var tsegs=[];for(var r=0;r<3;r++) all.forEach(function(c){tsegs.push({c:c,b:4,line:0,part:''});});
  build(document.querySelector('[data-player="treino"]'),{segs:tsegs,lines:[],style:(songs[0]&&songs[0].style)||'pop',slow:60,normal:80},true);
}
songs.forEach(function(s,i){build(document.querySelector('[data-player="'+i+'"]'),s,false);});
})();
</script>
</body>
</html>
